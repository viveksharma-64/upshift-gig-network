name: Daily Gig Health Check & Verification

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no database writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: upshift-health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    name: Execute Daily Opportunity Health Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Health Monitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANDIDATE_STORAGE: supabase
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "Starting UpShift daily published gig health check at $(date -u) (dry_run=$DRY_RUN)"
          if [ "$DRY_RUN" = "true" ]; then
            node src/server/monitor.js --storage=supabase --dry-run
          else
            node src/server/monitor.js --storage=supabase
          fi
